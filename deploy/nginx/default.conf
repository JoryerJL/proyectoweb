# Docker's embedded DNS. Resolving "web" per request (via a variable) means nginx
# keeps working when only the web container is recreated and gets a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain HTTP: only the health check is served; everything else redirects to HTTPS.
server {
    listen 80;
    server_name _;

    include /etc/nginx/cloudflare-realip.conf;

    location = /healthz/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/cloudflare-realip.conf;

    # Allow image uploads from the news editor.
    client_max_body_size 20m;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 1d;
    }

    location / {
        # Variable without a URI part: the original request URI is passed unchanged.
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
