[project]
name = "canaco-infra"
version = "0.1.0"
description = "AWS CDK (Python) infrastructure for the Canaco production stack"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.260,<2.271",
    "constructs>=10.4,<11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
