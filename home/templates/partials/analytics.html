{% if ga_measurement_id %}
{# Consent Mode v2 (basic): everything denied until the visitor opts in. gtag.js itself is injected by canaco.js after consent. #}
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
    });
</script>
<meta name="ga-measurement-id" data-ga-id="{{ ga_measurement_id }}" content="">
{% endif %}
