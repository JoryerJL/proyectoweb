<tr id="categoria-{{ categoria.pk }}" data-row>
    <td class="cell-muted">{{ categoria.pk }}</td>
    <td class="cell-title">{{ categoria.nombre }}</td>
    <td class="cell-muted">{% if categoria.fk_user %}{{ categoria.fk_user.username }}{% else %}-{% endif %}</td>
    <td class="cell-muted">{{ categoria.createdat|date:"Y-m-d H:i" }}</td>
    <td>
        <div class="row-actions">
            <a href="{% url 'home:editar_categoria' categoria.pk %}" class="btn btn-ghost" data-dialog-open="#categoria-dialog" data-form-action="{% url 'home:editar_categoria' categoria.pk %}" data-ajax-action="replace-row" data-target="#categoria-{{ categoria.pk }}" data-dialog-title="Editar categoría" data-dialog-submit="Guardar cambios" data-field-nombre="{{ categoria.nombre }}">Editar</a>
            <form method="post" action="{% url 'home:eliminar_categoria' categoria.pk %}" data-ajax data-ajax-action="remove-row" data-confirm="¿Eliminar la categoría «{{ categoria.nombre }}»?">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost is-danger" title="Eliminar"><i class="bi bi-trash3" aria-hidden="true"></i><span class="visually-hidden">Eliminar</span></button>
            </form>
        </div>
    </td>
</tr>
