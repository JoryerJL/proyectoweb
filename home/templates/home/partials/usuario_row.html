<tr id="usuario-{{ user.pk }}" data-row>
    <td class="cell-muted">{{ user.pk }}</td>
    <td><span class="cell-user"><span class="avatar {% if user.pk|divisibleby:2 %}avatar--brand{% else %}avatar--mint{% endif %}">{{ user.username|first }}</span>{{ user.username }}</span></td>
    <td>{{ user.first_name|default:"-" }}</td>
    <td class="cell-muted">{{ user.email|default:"-" }}</td>
    <td>
        <span class="chip {% if user.rol.value == 'editor' %}chip--mint{% elif user.rol.value == 'colaborador' %}chip--sun{% endif %}">{{ user.rol.label }}</span>
    </td>
    <td>
        {% if user.is_active %}
        <span class="badge badge-success"><i class="bi bi-check-circle" aria-hidden="true"></i> Activo</span>
        {% else %}
        <span class="badge badge-danger"><i class="bi bi-lock" aria-hidden="true"></i> Bloqueado</span>
        {% endif %}
    </td>
    <td>
        <div class="row-actions">
            <a href="{% url 'home:editar_usuario' user.pk %}" class="btn btn-ghost" data-dialog-open="#usuario-dialog" data-dialog-mode="edit" data-form-action="{% url 'home:editar_usuario' user.pk %}" data-ajax-action="replace-row" data-target="#usuario-{{ user.pk }}" data-dialog-title="Editar usuario" data-dialog-submit="Guardar cambios" data-field-username="{{ user.username }}" data-field-email="{{ user.email }}" data-field-first_name="{{ user.first_name }}" data-field-apellido_paterno="{{ user.perfil.apellido_paterno }}" data-field-apellido_materno="{{ user.perfil.apellido_materno }}" data-field-rol="{{ user.rol.value }}">Editar</a>
            <form method="post" action="{% url 'home:bloquear_usuario' user.pk %}" data-ajax data-ajax-action="replace-row">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost">{% if user.is_active %}Bloquear{% else %}Desbloquear{% endif %}</button>
            </form>
            <form method="post" action="{% url 'home:eliminar_usuario' user.pk %}" data-ajax data-ajax-action="remove-row" data-confirm="¿Eliminar la cuenta de {{ user.username }}? Esta acción no se puede deshacer.">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost is-danger" title="Eliminar"><i class="bi bi-trash3" aria-hidden="true"></i><span class="visually-hidden">Eliminar</span></button>
            </form>
        </div>
    </td>
</tr>
